
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Alumni Management System</title>
    <link rel="icon" href="images/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fff8f0;
        }

        .navbar-custom {
            background-color: #30204f;
        }

        .register-card {
            max-width: 750px;
            border: none;
            border-top: 6px solid #f4a261;
            border-radius: 15px;
        }

        .register-title {
            color: #30204f;
        }

        .btn-orange {
            background-color: #f4a261;
            color: #30204f;
            border: none;
        }

        .btn-orange:hover {
            background-color: #30204f;
            color: white;
        }

        .custom-link {
            color: #d66a1f;
            text-decoration: none;
            font-weight: bold;
        }

        .custom-link:hover {
            text-decoration: underline;
        }

        .footer {
            background-color: #30204f;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">

    <div class="container">

        <a class="navbar-brand fw-bold fs-4" href="index.html">
            Alumni Connect
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">
                        Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="register.html">
                        Register
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<main class="container my-5">

    <div class="card register-card shadow mx-auto">

        <div class="card-body p-5">

            <div class="text-center mb-4">

                <h1 class="register-title fw-bold">
                    Create Your Account
                </h1>

                <p class="text-muted">
                    Join our alumni community
                </p>

            </div>

            <form>

                <div class="row">

                    <div class="col-md-6 mb-4">

                        <label for="fullname"
                               class="form-label fw-bold">
                            Full Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required>

                    </div>

                    <div class="col-md-6 mb-4">

                        <label for="email"
                               class="form-label fw-bold">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-4">

                        <label for="password"
                               class="form-label fw-bold">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required>

                    </div>

                    <div class="col-md-6 mb-4">

                        <label for="department"
                               class="form-label fw-bold">
                            Department
                        </label>

                        <select
                            class="form-select"
                            id="department"
                            name="department"
                            required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="software-engineering">
                                Software Engineering
                            </option>

                            <option value="computer-science">
                                Computer Science
                            </option>

                            <option value="information-technology">
                                Information Technology
                            </option>

                        </select>

                    </div>

                </div>

                <div class="mb-4">

                    <label for="year"
                           class="form-label fw-bold">
                        Graduation Year
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="year"
                        name="year"
                        placeholder="Enter graduation year">

                </div>

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        Gender
                    </label>

                    <div class="d-flex gap-4">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="gender"
                                id="male"
                                value="male">

                            <label class="form-check-label"
                                   for="male">
                                Male
                            </label>

                        </div>

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="gender"
                                id="female"
                                value="female">

                            <label class="form-check-label"
                                   for="female">
                                Female
                            </label>

                        </div>

                    </div>

                </div>

                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required>

                    <label class="form-check-label"
                           for="terms">
                        I agree to the terms and conditions
                    </label>

                </div>

                <button type="submit"
                        class="btn btn-orange btn-lg w-100">
                    Create Account
                </button>

            </form>

            <div class="text-center mt-4">

                <p class="mb-0">
                    Already have an account?
                    <a href="login.html"
                       class="custom-link">
                        Login Here
                    </a>
                </p>

            </div>

        </div>

    </div>

</main>

<footer class="footer text-white text-center py-4 mt-5">

    <p class="mb-0">
        &copy; 2026 Alumni Management System
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
