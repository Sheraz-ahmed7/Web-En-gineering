
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alumni Management System</title>
    <link rel="icon" href="images/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fff8f0;
        }

        .navbar-custom {
            background-color: #30204f;
        }

        .login-card {
            max-width: 500px;
            border: none;
            border-top: 6px solid #f4a261;
            border-radius: 15px;
        }

        .login-title {
            color: #30204f;
        }

        .btn-orange {
            background-color: #f4a261;
            color: #30204f;
            border: none;
        }

        .btn-orange:hover {
            background-color: #30204f;
            color: white;
        }

        .custom-link {
            color: #d66a1f;
            text-decoration: none;
            font-weight: bold;
        }

        .custom-link:hover {
            text-decoration: underline;
        }

        .footer {
            background-color: #30204f;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">

    <div class="container">

        <a class="navbar-brand fw-bold fs-4" href="index.html">
            Alumni Connect
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="login.html">
                        Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="register.html">
                        Register
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<main class="container my-5">

    <div class="card login-card shadow mx-auto">

        <div class="card-body p-5">

            <div class="text-center mb-4">

                <h1 class="login-title fw-bold">
                    Welcome Back
                </h1>

                <p class="text-muted">
                    Login to your alumni account
                </p>

            </div>

            <form>

                <div class="mb-4">

                    <label for="email"
                           class="form-label fw-bold">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control form-control-lg"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="mb-4">

                    <label for="password"
                           class="form-label fw-bold">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control form-control-lg"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>

                <button type="submit"
                        class="btn btn-orange btn-lg w-100">
                    Login
                </button>

            </form>

            <div class="text-center mt-4">

                <p class="mb-0">
                    Don't have an account?
                    <a href="register.html"
                       class="custom-link">
                        Register Here
                    </a>
                </p>

            </div>

        </div>

    </div>

</main>

<footer class="footer text-white text-center py-4 mt-5">

    <p class="mb-0">
        &copy; 2026 Alumni Management System
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
